function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function normalize(s){ return String(s).toLowerCase().trim().replace(/[éèêë]/g,"e").replace(/[àâä]/g,"a").replace(/[ùûü]/g,"u").replace(/ç/g,"c").replace(/[\s'.\-]/g,""); }
function docHTML(c){ return c.replace(/\{\{(\w)\}\}/g, '<span class="hlet" title="Lettre dorée du mot secret">$1</span>'); }
function pk(ri,pi){ return ri + "-" + pi; }
function roomSolved(ri){ return ROOMS[ri].puzzles.every(function(_,pi){ return S.solved[pk(ri,pi)]; }); }

function draft(key, p){
  if(!S.drafts[key]){

      input:"", picked:[], links:{}, vf:[null,null,null,null], wheels:null,
      shuffledWords: p && p.words ? shuffle(p.words) : [],
      shuffledItems: p && p.items ? shuffle(p.items) : [],
      shuffledRight: p && p.pairs ? shuffle(p.pairs.map(function(pr,i){ return {t:pr.right, k:i}; })) : []
    };
  }
  return S.drafts[key];
}

function initWheels(d, len){

}

// Calcul multi-criteres du simulateur Dispatch 2050
function mixStats(gw){
  function twh(s){ return gw[s.key]*s.cf*8.76; } // GW x facteur de charge x 8760 h = TWh
  var production = MIX_SOURCES.reduce(function(sm,s){ return sm + twh(s); },0);
  // Stress-test 1 : soir d'hiver anticyclonique, -5 °C, sans soleil et presque sans vent (Dunkelflaute)
  var winterPeak = MIX_SOURCES.reduce(function(sm,s){ return sm + gw[s.key]*s.w; },0);
  // Stress-test 2 : canicule + etiage a 13h (nucleaire bride par la temperature des fleuves)
  var summerCanicule = MIX_SOURCES.reduce(function(sm,s){ return sm + gw[s.key]*s.s; },0);
  // Emissions en Mt CO2e/an (analyse de cycle de vie) : gCO2/kWh x TWh / 1000
  var co2 = MIX_SOURCES.reduce(function(sm,s){ return sm + twh(s)*s.co2/1000; },0);
  var interTWh = twh(MIX_SOURCES[0]) + twh(MIX_SOURCES[1]);
  var shareInter = production > 0 ? interTWh / production : 0;
  var shareNuc = production > 0 ? twh(MIX_SOURCES[3]) / production : 0;
  // Cout complet en EUR/MWh = (couts fixes annualises + combustibles) / production
  // + surcout reseau (raccordements, inertie, equilibrage) quand l'intermittent depasse 40 %
  var gridSurcharge = shareInter > 0.40 ? (shareInter - 0.40) * 40 : 0;
  var totalCost = MIX_SOURCES.reduce(function(sm,s){ return sm + gw[s.key]*s.fixed + twh(s)*s.vc; },0);
  var avgCost = production > 0 ? totalCost/production + gridSurcharge : 0;
  // Indice d'emprise au sol / paysage (unites arbitraires)
  var landImpact = MIX_SOURCES.reduce(function(sm,s){ return sm + gw[s.key]*s.land; },0);
  var warnings = MIX_SOURCES.filter(function(s){ return s.warn && gw[s.key] > s.warn; }).map(function(s){ return s.warnTxt; });
  return { production:production, winterPeak:winterPeak, summerCanicule:summerCanicule, co2:co2, avgCost:avgCost, landImpact:landImpact, shareInter:shareInter, shareNuc:shareNuc, warnings:warnings };
}

  return [

    '<div style="font-size:3.5rem;margin-bottom:6px">🎉</div><h1>RÉSEAU 2050 REBRANCHÉ !</h1>'+
    '<p style="color:#a7f3d0;font-size:1.02rem;margin:6px 0 18px">L\'équipe <b style="color:#fff">'+esc(S.team)+'</b> a rétabli le système énergétique français !</p>'+
    '<div class="card victory-stats">'+
      '<div><div class="num">'+S.score+'</div><div class="cap">Score Final</div></div>'+
      '<div><div class="num">'+minutes+'m '+secs+'s</div><div class="cap">Temps Total</div></div>'+
      '<div><div class="num">'+S.hintsUsed+'</div><div class="cap">Indices utilisés</div></div>'+
      '<div><div class="num">'+S.errorsCount+'</div><div class="cap">Erreurs commises</div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px;text-align:left">'+
      '<p class="tag">📊 Fiche de Synthèse de votre Mix 2050 (à conserver pour le Débriefing au tableau)</p>'+
      '<p style="font-size:.9rem;margin-bottom:8px"><b>Puissances installées :</b> '+esc(S.finalDetail)+'</p>'+
      '<div class="row">'+
        '<span class="badge cyan">⚡ Prod : '+st.production.toFixed(0)+' TWh/an</span>'+
        '<span class="badge emerald">🌍 Climat : '+st.co2.toFixed(1)+' Mt CO2</span>'+
        '<span class="badge amber">💶 Coût : '+st.avgCost.toFixed(0)+' €/MWh</span>'+
        '<span class="badge">❄️ Pointe Hiver : '+st.winterPeak.toFixed(0)+' GW</span>'+
        (st.landImpact!==undefined ? '<span class="badge">🗺️ Emprise : '+st.landImpact.toFixed(0)+' pts</span>' : '')+
        (st.shareNuc!==undefined ? '<span class="badge rose">📚 Famille RTE : '+rteFamily(st).name+'</span>' : '')+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px;text-align:left">'+
      '<p style="color:#67e8f9;font-weight:700;margin-bottom:8px">🎓 Questions clés pour le Débriefing en classe (40 min)</p>'+
      '<ul class="debrief">'+
        '<li><b>Primaire vs Finale (Sankey) :</b> Pourquoi perd-on environ un tiers de l\'énergie primaire en France, et pourquoi les EnR thermiques (bois, PAC) pèsent-elles presque 2 fois plus lourd que les EnR électriques ?</li>'+
        '<li><b>Physique &amp; ordres de grandeur :</b> Quel est l\'effet de la loi en v³ sur l\'éolien en mer ? Le solaire thermique récupère 3,5 fois plus d\'énergie par m² que le PV : est-ce pour autant « mieux » ?</li>'+
        '<li><b>Comparez vos mix au tableau :</b> tous les groupes ont-ils la même famille RTE ? Comment chacun a-t-il passé le soir d\'hiver sans vent ? Qu\'avez-vous sacrifié : coût, emprise au sol, faisabilité industrielle ?</li>'+
        '<li><b>Débat nucléaire :</b> ~130 ans de ressources identifiées à consommation constante, Bure, rythme de construction des EPR2 : quel rôle pour la 4e génération ? Comparez les stratégies France / Allemagne / Chine.</li>'+
      '</ul>'+
    '</div>'+
    '<div class="row" style="margin-top:18px;justify-content:center"><button class="btn cyan" data-act="map">📂 Revoir les salles et les dossiers</button><button class="btn ghost" data-act="reset">🔄 Nouvelle partie</button></div></div></div>';
}

function render(){
  if(S.screen==="intro") renderIntro();
  else if(S.screen==="map") renderMap();
  else if(S.screen==="room") renderRoom();
  else if(S.screen==="final") renderFinal();
  else renderVictory();
}

// ================= LOGIQUE & PENALITES =================
function solve(ri, pi){
  var key = pk(ri,pi);
  if(S.solved[key]) return;
  S.solved[key] = true;
  S.score += POINTS;
  S.shownHint = null;
}

function applyPenalty(cardEl, customMsg){
  S.errorsCount++;
  S.score = Math.max(0, S.score - ERROR_PENALTY_PTS);
  S.secondsLeft = Math.max(0, S.secondsLeft - ERROR_PENALTY_SEC);
  var t = document.getElementById("timer");
  if(t) t.textContent = "⏱ " + fmtTimer();
  if(cardEl){
    cardEl.classList.remove("shake");
    void cardEl.offsetWidth;
    cardEl.classList.add("shake");
    var old = cardEl.querySelector(".fb.ko");
    if(old) old.remove();
    var box = document.createElement("div");
    box.className = "fb ko";
    box.innerHTML = "<b>✘ Verrou refusé (-"+ERROR_PENALTY_PTS+" pts et -"+ERROR_PENALTY_SEC+" sec). </b>" + customMsg;
    cardEl.appendChild(box);
  }
}

app.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");

  if(act==="start"){
    var v = document.getElementById("team").value.trim();
    if(v){ S.team = v; S.screen = "map"; render(); }
    else { document.getElementById("team").focus(); }
  }
  else if(act==="map"){ S.screen = "map"; S.openDoc = null; S.shownHint = null; render(); }
  else if(act==="room"){ S.roomIndex = parseInt(el.getAttribute("data-ri"),10); S.openDoc = null; S.shownHint = null; S.screen = "room"; render(); }
  else if(act==="final"){ S.screen = "final"; render(); }
  else if(act==="victory"){ S.screen = "victory"; render(); }
  else if(act==="doc"){ S.openDoc = el.getAttribute("data-id"); renderRoom(); }
  else if(act==="closedoc"){ S.openDoc = null; renderRoom(); }
  else if(act==="hint"){
    var k = el.getAttribute("data-key");
    if(S.shownHint !== k){
      S.shownHint = k;
      S.hintsUsed++;
      S.score = Math.max(0, S.score - HINT_COST);
    }
    renderRoom();
  }
  else if(act==="submit" || act==="order-submit" || act==="pairs-submit" || act==="vf-submit" || act==="usb-submit"){
    var key = el.getAttribute("data-key");
    var parts = key.split("-"); var ri = parseInt(parts[0],10), pi = parseInt(parts[1],10);
    var p = ROOMS[ri].puzzles[pi];
    var d = draft(key, p);
    var ok = false;
    if(p.kind==="code"){
      var code = wheelString("0123456789", initWheels(d, p.answer.length));
      if(p.tol){
        var n = parseInt(code, 10);
        ok = !isNaN(n) && Math.abs(n - parseFloat(p.answer)) <= p.tol;
      } else {
        ok = code === p.answer;
      }
    } else if(p.kind==="text"){
      var inp = document.getElementById("pinput");
      d.input = inp ? inp.value : "";
      ok = normalize(d.input) === normalize(p.answer);
    } else if(p.kind==="usb"){
      ok = d.picked.length===p.words.length && normalize(d.picked.join(" ")) === normalize(p.answer);
    } else if(p.kind==="order"){
      ok = d.picked.length===p.items.length && d.picked.every(function(it,i){ return it===p.items[i]; });
    } else if(p.kind==="pairs"){
      ok = p.pairs.every(function(_,i){ return d.links[i]===i; });
    } else if(p.kind==="vf"){
      ok = d.vf.every(function(v,i){ return v===p.answers[i]; });
    }
    if(ok){ solve(ri,pi); renderRoom(); }
    else {
      var msg = (p.kind==="code") ? "Combinaison numérique inexacte. Vérifiez vos calculs et ordres de grandeur dans les dossiers."
        : (p.kind==="usb") ? "Séquence de mots rejetée par le compilateur."
        : (p.kind==="text") ? "Terme technique incorrect. Inspectez les dossiers de la salle."
        : "Séquence ou association incorrecte. Concertation requise avant nouvel essai !";
      applyPenalty(el.closest(".card"), msg);
    }
  }
  else if(act==="wheel"){
    var kw = el.getAttribute("data-key");
    var partsW = kw.split("-");
    var dw = draft(kw, ROOMS[parseInt(partsW[0],10)].puzzles[parseInt(partsW[1],10)]);
    var i2 = parseInt(el.getAttribute("data-i"),10);
    var dr2 = parseInt(el.getAttribute("data-dir"),10)||1;
    dw.wheels[i2] = (dw.wheels[i2] + dr2 + 10) % 10;
    renderRoom();
  }
  else if(act==="wremove"){
    var kr = el.getAttribute("data-key");
    draft(kr).picked.splice(parseInt(el.getAttribute("data-i"),10),1);
    renderRoom();
  }
  else if(act==="secretwheel"){
    var i4 = parseInt(el.getAttribute("data-i"),10);
    var dr4 = parseInt(el.getAttribute("data-dir"),10)||1;
    S.secretPos[i4] = (S.secretPos[i4] + dr4 + 26) % 26;
    renderFinal();
  }
  else if(act==="pick"){
    var keyp = el.getAttribute("data-key");
    var val = el.getAttribute("data-val");
    var dp = draft(keyp);
    if(dp.picked.indexOf(val)<0){ dp.picked.push(val); }
    renderRoom();
  }
  else if(act==="clear"){
    var keyc = el.getAttribute("data-key");
    var dc2 = draft(keyc);
    dc2.picked = []; dc2.links = {};
    renderRoom();
  }
  else if(act==="pl"){
    S.activeLeft = parseInt(el.getAttribute("data-i"),10);
    S.activeKey = el.getAttribute("data-key");
    renderRoom();
  }
  else if(act==="pr"){
    var keyr = el.getAttribute("data-key");
    if(S.activeLeft!==null && S.activeKey===keyr){
      var dl = draft(keyr);
      dl.links[S.activeLeft] = parseInt(el.getAttribute("data-k"),10);
      S.activeLeft = null;
    }
    renderRoom();
  }
  else if(act==="vf"){
    var keyv = el.getAttribute("data-key");
    var dv = draft(keyv);
    dv.vf[parseInt(el.getAttribute("data-i"),10)] = el.getAttribute("data-v")==="1";
    renderRoom();
  }
  else if(act==="mix-submit"){
    S.mixTried = true;
    var st3 = mixStats(S.mix);
    var checks3 = getMixChecks(st3);
    if(checks3.every(function(c){ return c.ok; })){
      S.finalDetail = MIX_SOURCES.map(function(s){ return s.label+" : "+S.mix[s.key]+" GW"; }).join(" | ");
      S.solved["mix"] = true;
      S.score += MIX_POINTS;
      renderFinal();
    } else {
      applyPenalty(el.closest(".card"), "Votre mix énergétique ne respecte pas les 5 contraintes simultanées.");
    }
  }
  else if(act==="master"){
    var inps = app.querySelectorAll(".room-code-inp");
    inps.forEach(function(inp){
      var idx = parseInt(inp.getAttribute("data-ri"),10);
      S.roomCodeInputs[idx] = inp.value.trim();
    });
    var wrongRooms = [];
    ROOMS.forEach(function(r, idx){
      if(S.roomCodeInputs[idx] !== r.code) wrongRooms.push(idx+1);
    });
    if(wrongRooms.length === 0){
      S.masterOk = true;
      S.score += 30;
      renderFinal();
    } else {
      applyPenalty(el.closest(".card"), "Code(s) erroné(s) pour la ou les salle(s) n° " + wrongRooms.join(", ") + ". Fouillez les mémos croisés dans les dossiers !");
    }
  }
  else if(act==="secret"){
    if(wheelString("ABCDEFGHIJKLMNOPQRSTUVWXYZ", S.secretPos) === "CURIE"){
      S.score += 30;
      S.won = true;
      S.screen = "victory";
      render();
    } else {
      applyPenalty(el.closest(".card"), "Mot secret incorrect. Retournez inspecter les 5 lettres dorées dans les dossiers des salles 1 à 5.");
    }
  }
  else if(act==="reset"){
    if(S.screen !== "victory" && !window.confirm("Effacer définitivement la partie en cours ?")) return;
    clearSave();
    S = {
      screen:"intro", team:"", roomIndex:0, openDoc:null, solved:{}, score:100, hintsUsed:0, errorsCount:0, shownHint:null,
      secondsLeft:TOTAL_SECONDS, roomCodeInputs:["","","","",""], masterOk:false, secretPos:[0,0,0,0,0],
      finalDetail:"", drafts:{}, mix:null, mixTried:false, activeLeft:null, activeKey:null
    };
    render();
  }
});

// Sauvegarde apres chaque action (ce listener s'execute apres le precedent)
app.addEventListener("click", function(){ saveState(); });

app.addEventListener("input", function(e){
  if(e.target.id==="pinput"){
    var key = e.target.getAttribute("data-key");
    draft(key).input = e.target.value;
  }
  else if(e.target.classList.contains("room-code-inp")){
    var idx = parseInt(e.target.getAttribute("data-ri"),10);
    S.roomCodeInputs[idx] = e.target.value.trim();
  }
  else if(e.target.getAttribute("data-act")==="mix"){
    var mk = e.target.getAttribute("data-key");
    S.mix[mk] = parseInt(e.target.value,10);
    var gw2 = S.mix, st2 = mixStats(gw2);
    var idx2 = MIX_SOURCES.findIndex(function(s){ return s.key===mk; });
    var badges = app.querySelectorAll(".slider-row .badge");
    if(badges[idx2]) badges[idx2].textContent = gw2[mk]+" GW";
    var checksCont = document.getElementById("checks-container");
    var checks = getMixChecks(st2);
    if(checksCont){
      checksCont.innerHTML = checks.map(function(c){
        return '<div class="check '+(c.ok?"ok":"ko")+'"><div style="display:flex;justify-content:space-between"><span>'+(c.ok?"✅":"❌")+' <b>'+c.label+'</b></span><span style="font-family:monospace;font-weight:bold">'+c.v+'</span></div><div style="font-size:.73rem;color:rgba(255,255,255,.6);margin-top:3px">Contrainte : '+c.t+'</div></div>';
      }).join("") + mixInfoHTML(st2);
    }
    saveState();
    var btn = app.querySelector('[data-act="mix-submit"]');
    if(btn){
      var all2 = checks.every(function(c){ return c.ok; });
      btn.className = "btn "+(all2?"emerald":"cyan");
      btn.textContent = all2 ? "⚡ Valider et Verrouiller ce Mix 2050 !" : "Soumettre le Mix au Stress-Test";
    }
  }
});

app.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target.id==="pinput"){
    var key = e.target.getAttribute("data-key");
    var btn = app.querySelector('[data-act="submit"][data-key="'+key+'"]');
    if(btn && !btn.disabled) btn.click();
  }
  if(e.key==="Enter" && e.target.id==="team"){
    var b = app.querySelector('[data-act="start"]'); if(b) b.click();
  }
  if(e.key==="Escape" && S.openDoc){ S.openDoc = null; if(S.screen==="room") renderRoom(); }
});

// ================= TIMER =================
setInterval(function(){
  if(S.screen==="intro" || S.screen==="victory" || S.won) return;
  if(S.secondsLeft>0) S.secondsLeft--;
  var t = document.getElementById("timer");
  if(t){
    t.textContent = S.secondsLeft > 0 ? "⏱ " + fmtTimer() : "⏱ Temps écoulé : terminez la salle en cours";
    t.className = "badge mono" + (S.secondsLeft<300 ? " alarm" : "");
  }
  if(S.secondsLeft % 5 === 0) saveState();
}, 1000);

loadState();
render();
</script>
